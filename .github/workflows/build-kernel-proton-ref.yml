name: Build Kernel (proton ref / LLVM_IAS=1)

# Second contender: faithfully follows the carlodandan/Action-Kernel-Builder-Proton
# approach (proton-clang, CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 - integrated
# assembler ON). Run in parallel with build-kernel.yml (LLVM_IAS=0) to see which
# toolchain invocation builds this 4.19 tree. Still merges vendor/oplus.config so
# the patched oplus charger is compiled in.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/usb-vbus-glitch-debounce

jobs:
  build:
    # ubuntu-22.04 (glibc 2.35) does not emit .relr.dyn, so proton-clang's
    # bundled GNU ld can still link the host tools. Newer images (24.04) break it.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false

      - name: Set up build dir on /mnt and add swap
        run: |
          sudo mkdir -p /mnt/out
          sudo chown "$USER":"$(id -gn)" /mnt/out
          ln -sfn /mnt/out out
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile \
            && sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h / /mnt
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison cpio device-tree-compiler flex git libssl-dev rsync zip

      - name: Set up clang toolchain (proton-clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -1

      - name: Build kernel (reference style, LLVM_IAS=1)
        run: |
          set -o pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=actions KBUILD_BUILD_HOST=github
          MK="O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1"
          make -j"$(nproc)" $MK vendor/kona-perf_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config arch/arm64/configs/vendor/oplus.config
          make -j"$(nproc)" $MK olddefconfig
          grep -q "CONFIG_OPLUS_SM8250_CHARGER=y" out/.config \
            || { echo "ERROR: oplus charger (patched driver) not enabled"; exit 1; }
          make -j"$(nproc)" $MK KCFLAGS="-Wno-error" 2>&1 | tee build.log
          echo "=== boot outputs ==="
          ls -la out/arch/arm64/boot/

      - name: Package AnyKernel3 flashable zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -f AnyKernel3/Image* AnyKernel3/zImage AnyKernel3/*-dtb \
            AnyKernel3/*.dtb AnyKernel3/dtbo.img || true
          cp .github/anykernel/anykernel.sh AnyKernel3/anykernel.sh
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          else
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          ( cd AnyKernel3 && zip -r9 ../OnePlus8T-sm8250-vbusfix-IAS1-AnyKernel3.zip . -x '.git*' )
          ls -la *.zip

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8T-kernel-ias1
          path: |
            OnePlus8T-sm8250-vbusfix-IAS1-AnyKernel3.zip
            out/arch/arm64/boot/Image.gz
            out/.config
            build.log
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vbusfix-ias1-${{ github.run_id }}
          name: OnePlus 8T sm8250 vbus-fix (proton ref / LLVM_IAS=1, build ${{ github.run_number }})
          body: |
            Variant build using the proton-clang reference approach
            (`CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1`).

            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - Config: `vendor/kona-perf_defconfig` + `vendor/oplus.config` (full LTO + CFI)

            Flash `OnePlus8T-sm8250-vbusfix-IAS1-AnyKernel3.zip` (kernel-only).
          files: |
            OnePlus8T-sm8250-vbusfix-IAS1-AnyKernel3.zip
            out/arch/arm64/boot/Image.gz
            out/.config
